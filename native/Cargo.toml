[package]
name = "miru_desktop_client"
version = "0.1.15"
description = "Desktop client for Miru auto rendering and contributed render workers"
authors = ["eiewm"]
license-file = "../LICENSE"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "miru_desktop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures-util = "0.3"
hex = "0.4"
log = "0.4"
md5 = "0.7"
notify = "8"
open = "5"
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"], default-features = false }
rosu-pp = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1"
sha2 = "0.10"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
